  }

  .nav-link:hover::after { width: 60%; }

  .stamp-btn { background: #A61B29; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); transition: background 0.2s ease, transform 0.15s ease; }

  /* SVG сызықтары */

  .modal-enter { animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-width: 640px) {
    input, select, button { font-size: 16px !important; }
  }
</style>

<!-- ХЕДЕР -->

<!-- КІРУ, ТІРКЕЛУ ЖӘНЕ ҚҰПИЯ СӨЗДІ ҚАЛПЫНА КЕЛТІРУ ТЕРЕЗЕСІ (MODAL) -->
<div id="authModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 transition-opacity">
  <div class="modal-enter relative w-full max-w-sm rounded-2xl bg-white p-6 sm:p-8 shadow-2xl border border-gray-100">
    <button data-close-auth class="absolute right-5 top-5 text-gray-400 hover:text-gray-700 transition-colors bg-gray-50 rounded-full p-1 cursor-pointer">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <div id="loginSection">
      <h2 class="font-display mb-6 text-2xl font-bold text-gray-900">Кіру</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Email немесе Пайдаланушы аты</label>
          <input type="text" id="loginIdentifier" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Құпия сөз</label>
          <input type="password" id="loginPassword" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div class="flex items-center justify-end text-xs sm:text-sm">
          <button type="button" id="toForgotBtn" class="text-gray-500 hover:text-seal hover:underline transition-colors cursor-pointer">Құпия сөзді ұмытыңыз ба?</button>
        </div>
        <div id="loginError" class="hidden p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center"></div>
        <button type="submit" id="loginSubmitBtn" class="w-full rounded-lg bg-seal px-4 py-3 text-base font-semibold text-white transition-all hover:bg-seal-dark hover:shadow-lg flex items-center justify-center cursor-pointer">
          <span>Кіру</span>
        </button>
      </form>
    </div>

    <!-- Тіркелу формасы (осы бетке қажет емес болса да, логиканың дұрыс жұмыс істеуі үшін қалдырылды) -->
    <div id="registerSection" class="hidden"></div>

    <div id="forgotSection" class="hidden">
      <h2 class="font-display mb-4 text-xl font-bold text-gray-900">Құпия сөзді қалпына келтіру</h2>
      <p class="text-xs text-gray-600 mb-4">Email адресіңізді жазыңыз, біз сізге нұсқаулық жібереміз.</p>
      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="forgotEmail" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div id="forgotMessage" class="hidden p-3 rounded-lg border text-sm font-medium text-center"></div>
        <button type="submit" id="forgotSubmitBtn" class="w-full rounded-lg bg-seal px-4 py-3 text-base font-semibold text-white transition-all hover:bg-seal-dark hover:shadow-lg flex items-center justify-center cursor-pointer">
          <span>Жіберу</span>
        </button>
      </form>
      <div class="mt-6 text-center text-sm text-gray-500">
        <button type="button" id="backToLoginBtn" class="text-gray-500 font-semibold hover:text-seal transition-colors hover:underline cursor-pointer">← Кіруге қайту</button>
      </div>
    </div>
  </div>
</div>

<!-- НЕГІЗГІ ЖҰМЫС АЙМАҒЫ -->
<main class="flex-1 flex overflow-hidden">

      <!-- Сүзгілер -->

        <div class="relative">

            <option value="all">🧩 Барлық басты ключтер (所有部首)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
        
        <input type="text" id="searchBox" placeholder="Іздеу / 搜索 (Сөз, пиньинь)..." oninput="applyFilters()" class="w-full p-3 rounded-xl border border-paper-deep text-sm focus:border-seal focus:ring-1 focus:ring-seal outline-none bg-white text-ink shadow-sm placeholder:text-gray-400">
      </div>
    </div>

    <!-- Тізім -->
    <div id="charList" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-paper">
      <!-- Динамикалық түрде қосылады -->
    </div>
  </aside>

  <!-- ОҢ ЖАҚ АЙМАҚ (КӨК ФОНДЫ ИНТЕРАКТИВТІ КАРТА) -->
  <section class="flex-1 relative flex items-center justify-center bg-gradient-to-br from-[#0c1f4c] to-[#06102a] overflow-hidden">
    <!-- Фондағы торлы өрнек -->
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 40px 40px;"></div>
    
    <!-- Фондағы су таңбасы -->
    <div class="absolute right-[-40px] bottom-[-60px] font-brush text-[350px] leading-none text-white opacity-[0.02] pointer-events-none select-none">汉</div>

    <!-- Карта контейнері -->
    <div id="mindmapContainer" class="relative w-[900px] h-[650px] flex items-center justify-center">

    </div>
  </section>

<script>
  const SCRIPT_URL = 'https://chinese-backend-yurc.onrender.com/api';

  // Хедердегі Пайдаланушы атын өзгерту логикасы
  document.addEventListener('DOMContentLoaded', () => {
    const currentUser = sessionStorage.getItem('currentUser');
    if (currentUser) {
      const nameLabel = document.getElementById('userNameLabel');
      const avatarLabel = document.getElementById('userAvatar');
      if (nameLabel) nameLabel.textContent = currentUser;
      if (avatarLabel) avatarLabel.textContent = currentUser.charAt(0).toUpperCase();
    }
  });

  const authModal = document.getElementById('authModal');
  const loginSection = document.getElementById('loginSection');
  const forgotSection = document.getElementById('forgotSection');

  const loginForm = document.getElementById('loginForm');
  const forgotForm = document.getElementById('forgotForm');

  const loginError = document.getElementById('loginError');
  const forgotMessage = document.getElementById('forgotMessage');

  // Мобильді мәзірді қосу/өшіру
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  if (mobileMenuBtn && mobileMenu) {
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  }

  // ЖАБЫҚ СІЛТЕМЕЛЕРДІ ҚОРҒАУ ЛОГИКАСЫ
  document.querySelectorAll('.protected-link').forEach(link => {
    link.addEventListener('click', (e) => {
      if (!sessionStorage.getItem('currentUser')) {
        e.preventDefault(); 
        authModal.classList.remove('hidden');
        showSection('login');
        loginError.textContent = 'Бұл бөлімді көру үшін алдымен жүйеге кіріңіз.';
        loginError.className = 'p-3 rounded-lg bg-blue-50 border border-blue-100 text-sm text-blue-800 font-medium text-center block';
        loginError.classList.remove('hidden');
      }
    });
  });

  document.querySelectorAll('[data-open-auth]').forEach(b => {
    b.addEventListener('click', (e) => {
      if (e) e.preventDefault();
      authModal.classList.remove('hidden');
      showSection('login');
    });
  });
  
  document.querySelectorAll('[data-close-auth]').forEach(b => {
    b.addEventListener('click', () => authModal.classList.add('hidden'));
  });

  function showSection(type) {
    loginSection.classList.add('hidden');
    forgotSection.classList.add('hidden');
    loginError.classList.add('hidden');
    forgotMessage.classList.add('hidden');

    if (type === 'login') loginSection.classList.remove('hidden');
    if (type === 'forgot') forgotSection.classList.remove('hidden');
  }

  document.getElementById('toForgotBtn').addEventListener('click', () => showSection('forgot'));
  document.getElementById('backToLoginBtn').addEventListener('click', () => showSection('login'));

  function setLoadingState(buttonId, isLoading, originalText) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    if (isLoading) {
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Күте тұрыңыз...`;
    } else {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      btn.innerHTML = `<span>${originalText}</span>`;
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    
    loginError.classList.add('hidden');
    setLoadingState('loginSubmitBtn', true, 'Кіру');

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', identifier, password })
      });
      const result = await response.json();

      if (result.status === 'success') {
        authModal.classList.add('hidden');
        sessionStorage.setItem('currentUser', result.name);
        window.location.href = result.role === 'teacher' || result.name === 'Bulanay Yerkin' 
          ? `admin.html?name=${encodeURIComponent(result.name)}`
          : `dashboard.html?name=${encodeURIComponent(result.name)}`;
      } else {
        loginError.textContent = result.message || 'Қате деректер енгізілді.';
        loginError.className = 'p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center block';
      }
    } catch (err) {
      loginError.textContent = 'Сервермен байланыс үзілді. Қайта көріңіз.';
      loginError.className = 'p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center block';
    } finally {
      setLoadingState('loginSubmitBtn', false, 'Кіру');
    }
  });

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    
    forgotMessage.classList.add('hidden');
    setLoadingState('forgotSubmitBtn', true, 'Жіберу');

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'forgotPassword', email })
      });
      const result = await response.json();

      forgotMessage.textContent = result.message || 'Қалпына келтіру сілтемесі поштаңызға жіберілді.';
      forgotMessage.className = result.status === 'success' 
        ? 'p-3 rounded-lg bg-green-50 border border-green-100 text-sm text-jade font-medium text-center block' 
        : 'p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center block';
    } catch (err) {
      forgotMessage.textContent = 'Қате орын алды.';
      forgotMessage.className = 'p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center block';
    } finally {
      setLoadingState('forgotSubmitBtn', false, 'Жіберу');
    }
  });

  // HSK 1-3 БАЗАСЫ
  const hskData = {
    1: [
      { hanzi: "爱", pinyin: "ài", meaning: "жақсы көру, сүю", radical: "心 (Жүрек)", topic: "Адам және сезім", parts: [{char: "爪", pinyin: "zhǎo", name: "Тырнақ"}, {char: "心", pinyin: "xīn", name: "Жүрек"}] },
      { hanzi: "八", pinyin: "bā", meaning: "сегіз", radical: "八 (Сегіз)", topic: "Сандар", parts: [{char: "八", pinyin: "bā", name: "Сегіз"}] },
      { hanzi: "爸爸", pinyin: "bàba", meaning: "әке", radical: "父 (Әке)", topic: "Отбасы", parts: [{char: "父", pinyin: "fù", name: "Әке"}, {char: "巴", pinyin: "bā", name: "Фонетик"}] },
      { hanzi: "杯子", pinyin: "bēizi", meaning: "кесе, стақан", radical: "木 (Ағаш)", topic: "Тұрмыс", parts: [{char: "杯", pinyin: "bēi", name: "Кесе"}, {char: "子", pinyin: "zi", name: "Зат есім жұрнағы"}] },
      { hanzi: "北京", pinyin: "Běijīng", meaning: "Бейжің", radical: "北京 (Қала)", topic: "Орын", parts: [{char: "北", pinyin: "běi", name: "Солтүстік"}, {char: "京", pinyin: "jīng", name: "Астана"}] },
      { hanzi: "不客气", pinyin: "bú kèqi", meaning: "оқасы жоқ", radical: "不 (Жоқ)", topic: "Этикет", parts: [{char: "不", pinyin: "bù", name: "Жоқ"}, {char: "客", pinyin: "kè", name: "Қонақ"}, {char: "气", pinyin: "qì", name: "Ауа/Көңіл"}] },
      { hanzi: "吃", pinyin: "chī", meaning: "жеу", radical: "口 (Ауыз)", topic: "Әрекет", parts: [{char: "口", pinyin: "kǒu", name: "Ауыз"}, {char: "乞", pinyin: "qǐ", name: "Сұрау"}] },
      { hanzi: "出租车", pinyin: "chūzūchē", meaning: "такси", radical: "车 (Көлік)", topic: "Көлік", parts: [{char: "出", pinyin: "chū", name: "Шығу"}, {char: "租", pinyin: "zū", name: "Жалға алу"}, {char: "车", pinyin: "chē", name: "Көлік"}] },
      { hanzi: "大", pinyin: "dà", meaning: "үлкен", radical: "大 (Үлкен)", topic: "Сипаттама", parts: [{char: "大", pinyin: "dà", name: "Адам бейнесі"}] },
      { hanzi: "电脑", pinyin: "diànnǎo", meaning: "компьютер", radical: "雨 (Электр)", topic: "Технология", parts: [{char: "电", pinyin: "diàn", name: "Тоқ"}, {char: "脑", pinyin: "nǎo", name: "Ми"}] },
      { hanzi: "东西", pinyin: "dōngxi", meaning: "зат, нәрсе", radical: "木 (Ағаш)", topic: "Заттар", parts: [{char: "东", pinyin: "dōng", name: "Шығыс"}, {char: "西", pinyin: "xi", name: "Батыс"}] },
      { hanzi: "饭店", pinyin: "fàndiàn", meaning: "мейрамхана", radical: "饣 (Ас)", topic: "Тамақ", parts: [{char: "饭", pinyin: "fàn", name: "Күріш/Ас"}, {char: "店", pinyin: "diàn", name: "Дүкен"}] },
      { hanzi: "买", pinyin: "mǎi", meaning: "сатып алу", radical: "罒 (Тор)", topic: "Әрекет", parts: [{char: "买", pinyin: "mǎi", name: "Сатып алу"}] }
    ],
    2: [
      { hanzi: "帮助", pinyin: "bāngzhù", meaning: "көмектесу", radical: "巾 (Орамал)", topic: "Әрекет", parts: [{char: "帮", pinyin: "bāng", name: "Көмек"}, {char: "助", pinyin: "zhù", name: "Жәрдем"}] },
      { hanzi: "报纸", pinyin: "bàozhǐ", meaning: "газет", radical: "扌 (Қол)", topic: "Оқу", parts: [{char: "报", pinyin: "bào", name: "Хабарлау"}, {char: "纸", pinyin: "zhǐ", name: "Қағаз"}] },
      { hanzi: "打篮球", pinyin: "dǎ lánqiú", meaning: "баскетбол ойнау", radical: "扌 (Қол)", topic: "Спорт", parts: [{char: "打", pinyin: "dǎ", name: "Ұру/Ойнау"}, {char: "篮", pinyin: "lán", name: "Себет"}, {char: "球", pinyin: "qiú", name: "Доп"}] },
      { hanzi: "机场", pinyin: "jīchǎng", meaning: "әуежай", radical: "木 (Ағаш)", topic: "Орын", parts: [{char: "机", pinyin: "jī", name: "Аппарат"}, {char: "场", pinyin: "chǎng", name: "Алаң"}] },
      { hanzi: "旅游", pinyin: "lǚyóu", meaning: "саяхат", radical: "方 (Жақ)", topic: "Саяхат", parts: [{char: "旅", pinyin: "lǚ", name: "Саяхат"}, {char: "游", pinyin: "yóu", name: "Жүзу/Қыдыру"}] },
      { hanzi: "上班", pinyin: "shàngbān", meaning: "жұмысқа бару", radical: "王 (Нефрит)", topic: "Қызмет", parts: [{char: "上", pinyin: "shàng", name: "Үсті/Бастау"}, {char: "班", pinyin: "bān", name: "Ауысым/Топ"}] }
    ],
    3: [
      { hanzi: "电梯", pinyin: "diàntī", meaning: "жеделсаты (лифт)", radical: "雨 (Электр)", topic: "Тұрмыс", parts: [{char: "电", pinyin: "diàn", name: "Электр"}, {char: "梯", pinyin: "tī", name: "Саты"}] },
      { hanzi: "电子邮件", pinyin: "diànzǐ yóujiàn", meaning: "электрондық пошта", radical: "雨 (Электр)", topic: "Технология", parts: [{char: "电子", pinyin: "diànzǐ", name: "Электрон"}, {char: "邮", pinyin: "yóu", name: "Пошта"}, {char: "件", pinyin: "jiàn", name: "Хат/Дана"}] },
      { hanzi: "动物", pinyin: "dòngwù", meaning: "жануар", radical: "力 (Күш)", topic: "Табиғат", parts: [{char: "动", pinyin: "dòng", name: "Қозғалу"}, {char: "物", pinyin: "wù", name: "Зат"}] },
      { hanzi: "发烧", pinyin: "fāshāo", meaning: "дене қызуы көтерілу", radical: "火 (От)", topic: "Денсаулық", parts: [{char: "发", pinyin: "fā", name: "Шығару"}, {char: "烧", pinyin: "shāo", name: "Жану"}] },
      { hanzi: "环境", pinyin: "huánjìng", meaning: "қоршаған орта", radical: "王 (Патша)", topic: "Табиғат", parts: [{char: "环", pinyin: "huán", name: "Шеңбер"}, {char: "境", pinyin: "jìng", name: "Орта"}] },
      { hanzi: "护照", pinyin: "hùzhào", meaning: "төлқұжат", radical: "扌 (Қол)", topic: "Құжат", parts: [{char: "护", pinyin: "hù", name: "Қорғау"}, {char: "照", pinyin: "zhào", name: "Куәлік/Сурет"}] }
    ]
  };

  let currentLevel = 1;
  let filteredItems = [];

  // Деңгейді ауыстыру
  function switchLevel(level, btnElement) {
    currentLevel = level;
    document.querySelectorAll('.hsk-btn').forEach(btn => {
      btn.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition-colors text-gray-600 hsk-btn hover:bg-white";
    });
    btnElement.className = "flex-1 py-2.5 rounded-lg font-bold text-sm transition-colors bg-seal text-white shadow-sm hsk-btn";
    
    updateDropdowns();
    applyFilters();
  }

  // Сүзгілерді жаңарту
  function updateDropdowns() {
    const topicSelect = document.getElementById('topicSelect');
    const radicalSelect = document.getElementById('radicalSelect');
    
    topicSelect.innerHTML = '<option value="all">📁 Барлық тақырыптар (所有主题)</option>';
    radicalSelect.innerHTML = '<option value="all">🧩 Барлық басты ключтер (所有部首)</option>';
    
    const items = hskData[currentLevel] || [];
    const topics = [...new Set(items.map(i => i.topic))].sort();
    const radicals = [...new Set(items.map(i => i.radical))].sort();

    topics.forEach(top => {
        topicSelect.innerHTML += `<option value="${top}">${top}</option>`;
    });
    radicals.forEach(rad => {
        radicalSelect.innerHTML += `<option value="${rad}">Ключ: ${rad}</option>`;
    });
  }

  // Сүзгіні қолдану
  function applyFilters() {
    const topic = document.getElementById('topicSelect').value;
    const radical = document.getElementById('radicalSelect').value;
    const query = document.getElementById('searchBox').value.toLowerCase();
    
    let items = hskData[currentLevel] || [];
    if (topic !== 'all') items = items.filter(i => i.topic === topic);
    if (radical !== 'all') items = items.filter(i => i.radical === radical);
    if (query.trim() !== '') {
        items = items.filter(i => i.hanzi.toLowerCase().includes(query) || i.pinyin.toLowerCase().includes(query) || i.meaning.toLowerCase().includes(query));
    }

    filteredItems = items;
    renderList();
  }

  // Тізімді шығару (БЕЖ ФОНДАҒЫ ДИЗАЙН)
  function renderList() {
    const list = document.getElementById('charList');
    list.innerHTML = '';

    const activeClasses = 'p-3 rounded-xl border border-seal bg-red-50/40 cursor-pointer transition-all flex items-center justify-between shadow-sm';
    const inactiveClasses = 'p-3 rounded-xl border border-paper-deep bg-transparent hover:bg-white/60 hover:border-seal/30 cursor-pointer transition-all flex items-center justify-between';

    filteredItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = index === 0 ? activeClasses : inactiveClasses;
        
        div.innerHTML = `
            <div class="flex items-center gap-4">
                <span class="text-4xl font-bold font-display text-seal w-12 text-center drop-shadow-sm">${item.hanzi}</span>
                <div class="flex flex-col justify-center gap-0.5">
                    <div class="text-[13px] text-gray-500 font-medium leading-none">${item.pinyin}</div>
                    <div class="text-[15px] font-semibold text-gray-900 leading-snug">${item.meaning}</div>
                </div>
            </div>
            <div class="flex flex-col items-end justify-between self-stretch py-0.5">
                <span class="text-[10px] bg-paper-deep/60 text-gray-600 px-2 py-0.5 rounded-md whitespace-nowrap">${item.topic}</span>
                <span class="text-[13px] text-seal font-bold px-1">${item.radical.split(' ')[0]}</span>
            </div>
        `;
        
        div.onclick = () => {
            Array.from(list.children).forEach(child => child.className = inactiveClasses);
            div.className = activeClasses;
            updateMindmap(item);
        };
        list.appendChild(div);
    });

    if (filteredItems.length > 0) updateMindmap(filteredItems[0]);
    else document.getElementById('mindmapContainer').innerHTML = '<div class="text-white/60 font-medium">Деректер табылмады</div>';
  }

  // Интерактивті картаны (Mindmap) салу
  function updateMindmap(data) {
    const container = document.getElementById('mindmapContainer');
    const parts = data.parts || [];
    const count = parts.length;
    const cx = 450, cy = 325; // Center of 900x650 container

    let svgLines = '';
    let nodesHtml = '';

    // ОРТАЛЫҚ ҮЛКЕН БЛОК (Иероглиф)
    nodesHtml += `
      <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[140px] h-[140px] rounded-full bg-seal text-white flex flex-col items-center justify-center shadow-[0_0_30px_rgba(166,27,41,0.5)] cursor-pointer hover:scale-105 transition-transform z-20" onclick="playAudio('${data.hanzi}')">
        <span class="font-display text-[42px] font-bold leading-none mb-1">${data.hanzi}</span>
        <span class="text-[10px] opacity-90 flex items-center gap-1 font-medium bg-black/20 px-2.5 py-0.5 rounded-full">🔊 Дыбыстау</span>
      </div>
    `;

    // ЖОҒАРҒЫ БЛОК (Пиньинь)
    svgLines += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="80" />`;
    nodesHtml += `
      <div class="absolute left-1/2 top-[40px] -translate-x-1/2 bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-5 py-3 shadow-lg text-center z-10 min-w-[180px] hover:border-seal transition-colors">
        <div class="text-[10px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">Пиньинь / 拼音</div>
        <div class="text-sm font-bold text-ink">${data.pinyin}</div>
      </div>
    `;

    // ОҢ ЖАҚ БЛОК (Мағынасы)
    svgLines += `<line x1="${cx}" y1="${cy}" x2="720" y2="${cy}" />`;
    nodesHtml += `
      <div class="absolute top-1/2 right-[20px] -translate-y-1/2 bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-5 py-3 shadow-lg text-center z-10 w-[200px] hover:border-seal transition-colors">
        <div class="text-[10px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">Мағынасы / 释义</div>
        <div class="text-[13px] font-bold text-ink break-words">${data.meaning}</div>
      </div>
    `;

    // ТӨМЕНГІ БЛОК (Тақырып)
    svgLines += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="570" />`;
    nodesHtml += `
      <div class="absolute left-1/2 bottom-[40px] -translate-x-1/2 bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-5 py-3 shadow-lg text-center z-10 min-w-[180px] hover:border-seal transition-colors">
        <div class="text-[10px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">Тақырып / 主题</div>
        <div class="text-sm font-bold text-ink">${data.topic}</div>
      </div>
    `;

    // СОЛ ЖАҚ ТАРМАҚТАР (Ключтер мен бөлшектер)
    const leftX = 160;
    
    if (count >= 3) {
        // 3 бөлік болса
        const yPositions = [150, 325, 500];
        parts.forEach((p, i) => {
            if(i < 3) {
                svgLines += `<line x1="${cx}" y1="${cy}" x2="${leftX+75}" y2="${yPositions[i]}" />`;
                nodesHtml += generatePartNode(p, i+1, leftX, yPositions[i]);
            }
        });
    } else if (count === 2) {
        // 2 бөлік болса
        const yPositions = [210, 440];
        parts.forEach((p, i) => {
            svgLines += `<line x1="${cx}" y1="${cy}" x2="${leftX+75}" y2="${yPositions[i]}" />`;
            nodesHtml += generatePartNode(p, i+1, leftX, yPositions[i]);
        });
    } else {
        // 1 бөлік болса
        svgLines += `<line x1="${cx}" y1="${cy}" x2="${leftX+75}" y2="${cy}" />`;
        nodesHtml += generatePartNode(parts[0] || {char: data.radical, pinyin: '', name: 'Негізгі ключ'}, 1, leftX, cy);
    }

    container.innerHTML = `<svg class="connections absolute inset-0 w-full h-full z-0">${svgLines}</svg>` + nodesHtml;
  }

  // Әр бөлікке (тармаққа) арналған карточка жасау
  function generatePartNode(part, index, x, y) {
      return `
        <div class="absolute bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-4 py-3 shadow-lg text-center z-10 w-[170px] cursor-pointer hover:border-seal hover:scale-105 transform group transition-all" 
             style="left: ${x-85}px; top: ${y-40}px;" onclick="playAudio('${part.char}')">
            <div class="text-[9px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">${index}-ші бөлік / 部首 ${index}</div>
            <div class="text-xl font-display font-bold text-seal mb-1 drop-shadow-sm">${part.char}</div>
            <div class="text-[11px] font-bold text-ink mb-1.5">${part.pinyin} - ${part.name}</div>
            <div class="text-[10px] text-seal font-semibold opacity-0 group-hover:opacity-100 transition-opacity flex justify-center items-center gap-1 bg-red-50/80 rounded py-0.5 mx-2">
               <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg> 
               Тыңдау
            </div>
        </div>
      `;
  }

  // Аудио функциясы
  function playAudio(text) {
      if (!text) return;
      if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-CN';
          utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
      } else {
          alert("Кешіріңіз, сіздің браузеріңіз аудио функциясын қолдамайды.");
      }
  }

  // Бастапқы іске қосу
  window.onload = () => {
    // Жүктелген кезде HSK 1 батырмасын активті ету
    const btn = document.getElementById('btnHsk1');
    if(btn) switchLevel(1, btn);
  };
</script>
