<!-- Қаріптер -->

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1B1B1F', seal: '#A61B29', 'seal-dark': '#7D1420',
          paper: '#F4EFE6', 'paper-deep': '#E8DFD1', gold: '#B8933F',
          jade: '#0D9488', 'jade-dark': '#1B5F58', mist: '#E0F2FE', sand: '#F0E5CE'
        },
        fontFamily: {
          display: ['"Noto Serif"', 'serif'],
          brush: ['"Ma Shan Zheng"', 'cursive'],
          sans: ['Inter', 'sans-serif'],
        }
      }

<style>
  html, body { height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    background: #F4EFE6;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;           /* мобильді браузердегі адрес жолағын ескереді */
    overflow: hidden;
  }

  .seal-stamp {
    background: radial-gradient(circle at 30% 25%, #C4313D 0%, #A61B29 55%, #7D1420 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.08);
    transform: rotate(-4deg);
    border-radius: 4px;
  }

  .nav-link { position: relative; padding-bottom: 2px; }
  .nav-link::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 0; height: 3px; background: #A61B29; border-radius: 2px 6px 2px 6px; transform: translateX(-50%); transition: width 0.25s ease; }
  .nav-link:hover::after { width: 60%; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E8DFD1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #d1c5b4; }

  .connections line { stroke: rgba(255, 255, 255, 0.15); stroke-width: 2; stroke-dasharray: 4; }

  .modal-enter { animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes modalFadeIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Мобильде input/select 16px болуы керек (iOS zoom болмауы үшін) */
  @media (max-width: 640px) {
    input, select { font-size: 16px !important; }
  }

  /* Сүзгі панелі: мобильде жасырылады, десктопта әрқашан көрінеді */
  #filterPanel { display: none; }
  #filterPanel.open { display: block; }
  @media (min-width: 1024px) { #filterPanel { display: block; } }

  /* Карта ауысқанда жұмсақ пайда болу */
  .map-fade { animation: mapFade 0.25s ease-out; }
  @keyframes mapFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .map-fade, .modal-enter { animation: none; } }

  #charList { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #A61B29; outline-offset: 2px; }
</style>
</head>

<!-- КІРУ, ТІРКЕЛУ ЖӘНЕ ҚҰПИЯ СӨЗДІ ҚАЛПЫНА КЕЛТІРУ ТЕРЕЗЕСІ (MODAL) -->
<div id="authModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 transition-opacity">
  <div class="modal-enter relative w-full max-w-sm rounded-2xl bg-white p-6 sm:p-8 shadow-2xl border border-gray-100">
    <button data-close-auth class="absolute right-5 top-5 text-gray-400 hover:text-gray-700 transition-colors bg-gray-50 rounded-full p-1 cursor-pointer">
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div id="loginSection">
      <h2 class="font-display mb-6 text-2xl font-bold text-gray-900">Кіру</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Email немесе Пайдаланушы аты</label>
          <input type="text" id="loginIdentifier" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Құпия сөз</label>
          <input type="password" id="loginPassword" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div class="flex items-center justify-end text-xs sm:text-sm">
          <button type="button" id="toForgotBtn" class="text-gray-500 hover:text-seal hover:underline transition-colors cursor-pointer">Құпия сөзді ұмытыңыз ба?</button>
        </div>
        <div id="loginError" class="hidden p-3 rounded-lg bg-red-50 border border-red-100 text-sm text-seal font-medium text-center"></div>
        <button type="submit" id="loginSubmitBtn" class="w-full rounded-lg bg-seal px-4 py-3 text-base font-semibold text-white transition-all hover:bg-seal-dark hover:shadow-lg flex items-center justify-center cursor-pointer">
          <span>Кіру</span>
        </button>
      </form>
    </div>

    <div id="registerSection" class="hidden"></div>

    <div id="forgotSection" class="hidden">
      <h2 class="font-display mb-4 text-xl font-bold text-gray-900">Құпия сөзді қалпына келтіру</h2>
      <p class="text-xs text-gray-600 mb-4">Email адресіңізді жазыңыз, біз сізге нұсқаулық жібереміз.</p>
      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="forgotEmail" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none focus:border-seal focus:ring-2 focus:ring-seal/20 transition-all">
        </div>
        <div id="forgotMessage" class="hidden p-3 rounded-lg border text-sm font-medium text-center"></div>
        <button type="submit" id="forgotSubmitBtn" class="w-full rounded-lg bg-seal px-4 py-3 text-base font-semibold text-white transition-all hover:bg-seal-dark hover:shadow-lg flex items-center justify-center cursor-pointer">
          <span>Жіберу</span>
        </button>
      </form>
      <div class="mt-6 text-center text-sm text-gray-500">
        <button type="button" id="backToLoginBtn" class="text-gray-500 font-semibold hover:text-seal transition-colors hover:underline cursor-pointer">← Кіруге қайту</button>
      </div>
    </div>

<!--
  НЕГІЗГІ ЖҰМЫС АЙМАҒЫ
  • Мобильді/планшет (<1024px): ҮСТІНДЕ карта, ТӨМЕНДЕ сөздер тізімі (вертикаль)
  • Десктоп (≥1024px): СОЛДА тізім, ОҢДА карта (горизонталь)
-->
<main class="flex-1 min-h-0 flex flex-col lg:flex-row overflow-hidden">

  <!-- КАРТА АЙМАҒЫ -->
  <section id="mapSection" class="order-1 lg:order-2 shrink-0 lg:shrink lg:flex-1 relative overflow-hidden bg-gradient-to-br from-[#0c1f4c] to-[#06102a] lg:flex lg:items-center lg:justify-center max-h-[46dvh] lg:max-h-none overflow-y-auto lg:overflow-hidden">
    <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 40px 40px;"></div>
    <div class="hidden lg:block absolute right-[-40px] bottom-[-60px] font-brush text-[350px] leading-none text-white opacity-[0.02] pointer-events-none select-none">汉</div>

    <!-- Алдыңғы / келесі сөз -->
    <div class="relative flex items-center justify-between gap-3 px-3 pt-3 sm:px-6 lg:absolute lg:top-4 lg:right-4 lg:z-30 lg:p-0">
      <button onclick="step(-1)" aria-label="Алдыңғы сөз" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/25 text-white flex items-center justify-center transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="wordCounter" class="text-white/70 text-xs font-semibold tabular-nums min-w-[52px] text-center">0 / 0</span>
      <button onclick="step(1)" aria-label="Келесі сөз" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 active:bg-white/25 text-white flex items-center justify-center transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Мобильде — өз биіктігі, десктопта — 900x650 және масштабталады -->
    <div id="mindmapContainer" class="relative w-full lg:w-[900px] lg:h-[650px] lg:shrink-0"></div>
  </section>

  <!-- ТІЗІМ / СҮЗГІ ПАНЕЛІ -->
  <aside class="order-2 lg:order-1 flex-1 min-h-0 lg:flex-none lg:w-[360px] border-t lg:border-t-0 lg:border-r border-paper-deep bg-paper flex flex-col shadow-sm z-20">
    <div class="p-3 lg:p-4 border-b border-paper-deep bg-paper z-10">

      <div class="flex gap-1.5 lg:gap-2 mb-3 bg-paper-deep/40 p-1 lg:p-1.5 rounded-xl border border-paper-deep">
        <button class="flex-1 py-2 lg:py-2.5 rounded-lg font-bold text-sm transition-colors text-gray-600 hsk-btn" onclick="switchLevel(1, this)" id="btnHsk1">HSK 1</button>
        <button class="flex-1 py-2 lg:py-2.5 rounded-lg font-bold text-sm transition-colors text-gray-600 hsk-btn" onclick="switchLevel(2, this)" id="btnHsk2">HSK 2</button>
        <button class="flex-1 py-2 lg:py-2.5 rounded-lg font-bold text-sm transition-colors text-gray-600 hsk-btn" onclick="switchLevel(3, this)" id="btnHsk3">HSK 3</button>
      </div>

      <!-- Іздеу + сүзгі батырмасы -->
      <div class="flex gap-2">
        <input type="text" id="searchBox" placeholder="Іздеу / 搜索 (Сөз, пиньинь)..." oninput="applyFilters()" class="flex-1 min-w-0 p-2.5 lg:p-3 rounded-xl border border-paper-deep text-sm focus:border-seal focus:ring-1 focus:ring-seal outline-none bg-white text-ink shadow-sm placeholder:text-gray-400">
        <button id="filterToggle" type="button" onclick="toggleFilters()" aria-label="Сүзгілер" aria-expanded="false" class="lg:hidden relative shrink-0 w-11 rounded-xl border border-paper-deep bg-white text-gray-700 shadow-sm flex items-center justify-center cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>
          <span id="filterDot" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-seal border-2 border-white"></span>
        </button>
      </div>

      <!-- Сүзгілер -->
      <div id="filterPanel" class="space-y-2 lg:space-y-3 mt-2 lg:mt-3">
        <div class="relative">
          <select id="topicSelect" onchange="applyFilters()" class="w-full p-2.5 lg:p-3 rounded-xl border border-paper-deep text-sm font-medium focus:border-seal focus:ring-1 focus:ring-seal outline-none bg-white text-gray-700 appearance-none shadow-sm cursor-pointer">
            <option value="all">📁 Барлық тақырыптар (所有主题)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>

        <div class="relative">
          <select id="radicalSelect" onchange="applyFilters()" class="w-full p-2.5 lg:p-3 rounded-xl border border-paper-deep text-sm font-medium focus:border-seal focus:ring-1 focus:ring-seal outline-none bg-white text-gray-700 appearance-none shadow-sm cursor-pointer">
            <option value="all">🧩 Барлық басты ключтер (所有部首)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Тізім: планшетте 2 баған, мобильде/десктопта 1 баған -->
    <div id="charList" class="flex-1 min-h-0 overflow-y-auto p-3 lg:p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2 lg:gap-3 content-start bg-paper"></div>
  </aside>
</main>

<script>
  const SCRIPT_URL = 'https://chinese-backend-yurc.onrender.com/api';

  document.addEventListener('DOMContentLoaded', () => {
    const currentUser = sessionStorage.getItem('currentUser');
    if (currentUser) {
      const nameLabel = document.getElementById('userNameLabel');
      const avatarLabel = document.getElementById('userAvatar');
      if (nameLabel) nameLabel.textContent = currentUser;
      if (avatarLabel) avatarLabel.textContent = currentUser.charAt(0).toUpperCase();

      document.querySelectorAll('.protected-link').forEach(link => {
        link.innerHTML = link.innerHTML.replace(' 🔒', '').replace('🔒 ', '');
      });

      // =========================================================
      // ADMIN PANEL INJECTION
      // =========================================================
      if (currentUser === 'Bulanay Yerkin') {
        const desktopNav = document.getElementById('desktopNav');
        if (desktopNav) {
          const adminLink = document.createElement('a');
          adminLink.href = `admin.html?name=${encodeURIComponent(currentUser)}`;
          adminLink.className = 'nav-link font-bold text-seal transition-colors';
          adminLink.textContent = 'Админ Панель';
          desktopNav.appendChild(adminLink);
        }

        const mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenu) {
          const adminLinkMob = document.createElement('a');
          adminLinkMob.href = `admin.html?name=${encodeURIComponent(currentUser)}`;
          adminLinkMob.className = 'block text-sm font-bold text-seal py-1';
          adminLinkMob.textContent = 'Админ Панель';
          mobileMenu.appendChild(adminLinkMob);
        }
      }
    }
  });

  const authModal = document.getElementById('authModal');
  const loginSection = document.getElementById('loginSection');
  const forgotSection = document.getElementById('forgotSection');

  const loginForm = document.getElementById('loginForm');
  const forgotForm = document.getElementById('forgotForm');

  const loginError = document.getElementById('loginError');
  const forgotMessage = document.getElementById('forgotMessage');

  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  if (mobileMenuBtn && mobileMenu) {
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
  }

  document.querySelectorAll('.protected-link').forEach(link => {
    link.addEventListener('click', (e) => {
      if (!sessionStorage.getItem('currentUser')) {
        e.preventDefault();
        authModal.classList.remove('hidden');
        showSection('login');
        loginError.textContent = 'Бұл бөлімді көру үшін алдымен жүйеге кіріңіз.';
        loginError.className = 'p-3 rounded-lg bg-blue-50 border border-blue-100 text-sm text-blue-800 font-medium text-center block';
        loginError.classList.remove('hidden');
      }
    });
  });

  document.querySelectorAll('[data-open-auth]').forEach(b => {
    b.addEventListener('click', (e) => {
      if (e) e.preventDefault();
      authModal.classList.remove('hidden');
      showSection('login');
    });
  });

  document.querySelectorAll('[data-close-auth]').forEach(b => {
    b.addEventListener('click', () => authModal.classList.add('hidden'));
  });

  function showSection(type) {
    loginSection.classList.add('hidden');
    forgotSection.classList.add('hidden');
    loginError.classList.add('hidden');
    forgotMessage.classList.add('hidden');

    if (type === 'login') loginSection.classList.remove('hidden');
    if (type === 'forgot') forgotSection.classList.remove('hidden');
  }

  document.getElementById('toForgotBtn').addEventListener('click', () => showSection('forgot'));
  document.getElementById('backToLoginBtn').addEventListener('click', () => showSection('login'));

  function setLoadingState(buttonId, isLoading, originalText) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    if (isLoading) {
      btn.disabled = true;
      btn.classList.add('opacity-80', 'cursor-not-allowed');
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Күте тұрыңыз...`;
    } else {
      btn.disabled = false;
      btn.classList.remove('opacity-80', 'cursor-not-allowed');
      btn.innerHTML = `<span>${originalText}</span>`;
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    loginError.classList.add('hidden');
    setLoadingState('loginSubmitBtn', true, 'Кіру');

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', identifier, password })

        window.location.href = result.role === 'teacher' || result.name === 'Bulanay Yerkin'

          : `dashboard.html?name=${encodeURIComponent(result.name)}`;

  // ===================== КҮЙ (STATE) =====================
  let currentLevel = 1;
  let filteredItems = [];
  let currentIndex = -1;

  const desktopMQ = window.matchMedia('(min-width: 1024px)');
  const isDesktop = () => desktopMQ.matches;

  // Иероглиф ұзындығына қарай қаріп өлшемі (px): ұзын сөздер сыймай қалмауы үшін
  function hanziPx(len, base) {
    if (len <= 2) return base;
    if (len === 3) return Math.round(base * 0.75);
    if (len === 4) return Math.round(base * 0.58);
    return Math.round(base * 0.46);
  }

  // ===================== ДЕҢГЕЙ / СҮЗГІ =====================
  function switchLevel(level, btnElement) {
    currentLevel = level;
    document.querySelectorAll('.hsk-btn').forEach(btn => {
      btn.className = "flex-1 py-2 lg:py-2.5 rounded-lg font-bold text-sm transition-colors text-gray-600 hsk-btn hover:bg-white";
    });
    btnElement.className = "flex-1 py-2 lg:py-2.5 rounded-lg font-bold text-sm transition-colors bg-seal text-white shadow-sm hsk-btn";

    updateDropdowns();
    applyFilters();
  }

  function updateDropdowns() {
    const topicSelect = document.getElementById('topicSelect');
    const radicalSelect = document.getElementById('radicalSelect');

    topicSelect.innerHTML = '<option value="all">📁 Барлық тақырыптар (所有主题)</option>';
    radicalSelect.innerHTML = '<option value="all">🧩 Барлық басты ключтер (所有部首)</option>';

    const items = hskData[currentLevel] || [];
    const topics = [...new Set(items.map(i => i.topic))].sort();
    const radicals = [...new Set(items.map(i => i.radical))].sort();

    topics.forEach(top => { topicSelect.innerHTML += `<option value="${top}">${top}</option>`; });
    radicals.forEach(rad => { radicalSelect.innerHTML += `<option value="${rad}">Ключ: ${rad}</option>`; });
  }

  function toggleFilters() {
    const panel = document.getElementById('filterPanel');
    const open = panel.classList.toggle('open');
    document.getElementById('filterToggle').setAttribute('aria-expanded', open);
  }

  function applyFilters() {
    const topic = document.getElementById('topicSelect').value;
    const radical = document.getElementById('radicalSelect').value;
    const query = document.getElementById('searchBox').value.toLowerCase();

    // Белсенді сүзгі болса, сүзгі батырмасында қызыл нүкте көрсету
    document.getElementById('filterDot').classList.toggle('hidden', topic === 'all' && radical === 'all');

    let items = hskData[currentLevel] || [];
    if (topic !== 'all') items = items.filter(i => i.topic === topic);
    if (radical !== 'all') items = items.filter(i => i.radical === radical);
    if (query.trim() !== '') {
      items = items.filter(i => i.hanzi.toLowerCase().includes(query) || i.pinyin.toLowerCase().includes(query) || i.meaning.toLowerCase().includes(query));
    }

    filteredItems = items;
    renderList();
  }

  // ===================== ТІЗІМ =====================
  const ACTIVE_CLS = 'p-2.5 lg:p-3 rounded-xl border border-seal bg-red-50/40 cursor-pointer transition-all shadow-sm';
  const INACTIVE_CLS = 'p-2.5 lg:p-3 rounded-xl border border-paper-deep bg-transparent hover:bg-white/60 hover:border-seal/30 active:bg-white cursor-pointer transition-all';

  function renderList() {
    const list = document.getElementById('charList');
    list.innerHTML = '';
    list.scrollTop = 0;

    filteredItems.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = INACTIVE_CLS;
      div.dataset.index = index;

      const len = [...item.hanzi].length;
      const px = hanziPx(len, 36);

      div.innerHTML = `
        <div class="flex items-center gap-3">
          <span class="shrink-0 min-w-[3.25rem] max-w-[6.5rem] text-center font-bold font-display text-seal whitespace-nowrap leading-none" style="font-size:${px}px">${item.hanzi}</span>
          <div class="flex-1 min-w-0">
            <div class="text-[13px] text-gray-500 font-medium leading-tight">${item.pinyin}</div>
            <div class="text-[15px] font-semibold text-gray-900 leading-snug">${item.meaning}</div>
          </div>
          <div class="shrink-0 flex flex-col items-end gap-1.5 self-stretch justify-between">
            <span class="text-[10px] bg-paper-deep/60 text-gray-600 px-2 py-0.5 rounded-md whitespace-nowrap max-w-[110px] truncate">${item.topic}</span>
            <span class="text-[13px] text-seal font-bold px-1">${item.radical.split(' ')[0]}</span>
          </div>
        </div>
      `;

      div.onclick = () => selectIndex(index, false);
      list.appendChild(div);
    });

    if (filteredItems.length > 0) {
      selectIndex(0, false);
    } else {
      currentIndex = -1;
      updateCounter();
      document.getElementById('mindmapContainer').innerHTML =
        '<div class="text-white/60 font-medium text-center py-10 lg:absolute lg:inset-0 lg:flex lg:items-center lg:justify-center">Деректер табылмады</div>';
    }
  }

  function selectIndex(index, scrollIntoList) {
    if (index < 0 || index >= filteredItems.length) return;
    currentIndex = index;

    const list = document.getElementById('charList');
    Array.from(list.children).forEach((child, i) => {
      child.className = i === index ? ACTIVE_CLS : INACTIVE_CLS;
    });
    if (scrollIntoList && list.children[index]) {
      list.children[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    updateCounter();
    updateMindmap(filteredItems[index]);
  }

  function step(dir) {
    const n = filteredItems.length;
    if (!n) return;
    selectIndex((currentIndex + dir + n) % n, true);
  }

  function updateCounter() {
    const n = filteredItems.length;
    document.getElementById('wordCounter').textContent = n ? `${currentIndex + 1} / ${n}` : '0 / 0';
  }

  // ===================== КАРТА =====================
  function updateMindmap(data) {
    if (isDesktop()) renderDesktopMap(data);
    else renderMobileMap(data);
    fitMap();
  }

  // Десктоп: 900x650 кенепті бос орынға сыйғызу (масштабтау)
  function fitMap() {
    const c = document.getElementById('mindmapContainer');
    if (!isDesktop()) { c.style.transform = ''; return; }
    const sec = document.getElementById('mapSection');
    const s = Math.min(1, (sec.clientWidth - 24) / 900, (sec.clientHeight - 24) / 650);
    c.style.transform = `scale(${s})`;
  }

  // ---- МОБИЛЬДІ / ПЛАНШЕТ: вертикаль, ықшам карта ----
  function renderMobileMap(data) {

            <span class="font-display font-bold leading-none whitespace-nowrap" style="font-size:${hanziPx(len, 44)}px">${data.hanzi}</span>

          </button>

            <div class="flex-1 bg-paper/95 border border-paper-deep rounded-xl px-3.5 py-2 flex flex-col justify-center">
              <div class="text-[10px] text-gray-500 font-semibold mb-0.5">Пиньинь / 拼音</div>
              <div class="text-base font-bold text-ink leading-tight break-words">${data.pinyin}</div>

              <div class="text-[10px] text-gray-500 font-semibold mb-0.5">Мағынасы / 释义</div>

  // ---- ДЕСКТОП: ортада иероглиф, айналасында тармақтар ----
  function renderDesktopMap(data) {
    const container = document.getElementById('mindmapContainer');
    const parts = data.parts || [];

    const cx = 450, cy = 325;
    const len = [...data.hanzi].length;

    let nodesHtml = '';

    nodesHtml += `

      </div>
    `;

    svgLines += `<line x1="${cx}" y1="${cy}" x2="720" y2="${cy}" />`;
    nodesHtml += `
      <div class="absolute top-1/2 right-[20px] -translate-y-1/2 bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-5 py-3 shadow-lg text-center z-10 w-[200px] hover:border-seal transition-colors">
        <div class="text-[10px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">Мағынасы / 释义</div>
        <div class="text-[13px] font-bold text-ink break-words">${data.meaning}</div>

    svgLines += `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="570" />`;
    nodesHtml += `

        }
      });
    } else if (count === 2) {
      const yPositions = [210, 440];
      parts.forEach((p, i) => {
        svgLines += `<line x1="${cx}" y1="${cy}" x2="${leftX + 75}" y2="${yPositions[i]}" />`;
        nodesHtml += generatePartNode(p, i + 1, leftX, yPositions[i]);
      });
    } else {
      svgLines += `<line x1="${cx}" y1="${cy}" x2="${leftX + 75}" y2="${cy}" />`;
      nodesHtml += generatePartNode(parts[0] || { char: data.radical, pinyin: '', name: 'Негізгі ключ' }, 1, leftX, cy);
    }

    container.innerHTML = `<svg class="connections absolute inset-0 w-full h-full z-0">${svgLines}</svg>` + nodesHtml;
  }

  function generatePartNode(part, index, x, y) {
    return `
      <div class="absolute bg-paper/95 backdrop-blur border border-paper-deep rounded-xl px-4 py-3 shadow-lg text-center z-10 w-[170px] cursor-pointer hover:border-seal hover:scale-105 transform group transition-all"
           style="left: ${x - 85}px; top: ${y - 40}px;" onclick="playAudio('${part.char}')">
          <div class="text-[9px] text-gray-500 uppercase tracking-wide mb-1 font-semibold">${index}-ші бөлік / 部首 ${index}</div>
          <div class="text-xl font-display font-bold text-seal mb-1 drop-shadow-sm">${part.char}</div>
          <div class="text-[11px] font-bold text-ink mb-1.5">${part.pinyin} - ${part.name}</div>
          <div class="text-[10px] text-seal font-semibold opacity-0 group-hover:opacity-100 transition-opacity flex justify-center items-center gap-1 bg-red-50/80 rounded py-0.5 mx-2">
             <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd"></path></svg>
             Тыңдау
          </div>
      </div>
    `;
  }

  // ===================== АУДИО =====================
  function playAudio(text) {
    if (!text) return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.8;
      window.speechSynthesis.speak(utterance);
    } else {
      alert("Кешіріңіз, сіздің браузеріңіз аудио функциясын қолдамайды.");
    }
  }

  // ===================== ЖАҢА ЖАҚСАРТУЛАР =====================
  // Экран өлшемі өзгергенде (телефонды бұрғанда, терезені созғанда) картаны қайта салу
  let lastMode = isDesktop();
  window.addEventListener('resize', () => {
    if (isDesktop() !== lastMode) {
      lastMode = isDesktop();
      if (currentIndex >= 0) updateMindmap(filteredItems[currentIndex]);
    }
    fitMap();
  });

  // Пернетақтамен ауысу (десктоп): ← ↑ / → ↓
  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  });

  // Телефонда картаны солға/оңға сипап келесі/алдыңғы сөзге ауысу (свайп)
  (function enableSwipe() {
    const sec = document.getElementById('mapSection');
    let sx = 0, sy = 0;
    sec.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    sec.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  // ===================== БАСТАПҚЫ ІСКЕ ҚОСУ =====================
  window.onload = () => {
    const btn = document.getElementById('btnHsk1');
    if (btn) switchLevel(1, btn);
  };
</script>
</body>
</html>
